<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HQR</title>
    <meta name="theme-color" content="#141318">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        html, body { margin: 0; height: 100%; background: #141318; overflow: hidden; }
        @media (prefers-color-scheme: light) { html, body { background: #fcf8ff; } }
        #unsupported { display: none; font: 16px/1.5 system-ui, sans-serif; color: #e5e1e9; padding: 32px; max-width: 520px; }
    </style>
</head>
<body>
<div id="unsupported">
    <h1>Este navegador não roda o HQR</h1>
    <p>Use uma versão recente do Chrome, Edge, Firefox ou Safari 18.2 ou mais nova.</p>
</div>
<script>
    // SCR-WEB-004 (RF-114, RNF-31): browsers without WebAssembly GC get a clear message.
    const wasmGc = (() => { try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0])); } catch (e) { return false; } })();
    if (!wasmGc) { document.getElementById('unsupported').style.display = 'block'; }
    else { const s = document.createElement('script'); s.src = 'hqr.js'; s.type = 'application/javascript'; document.body.appendChild(s); }
</script>
</body>
</html>
